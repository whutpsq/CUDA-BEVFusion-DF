node_name: "bevfusion_rscl"
module_name: "bevfusion_rscl"
device: "cuda:0"

model: "bevfusion_df"
precision: "fp16"
profile: "bevfusion_df"
cuda_build_dir: "../../build"
cuda_model_root: "../../model/bevfusion_df"
print_model_info: false

# Optional explicit overrides. If left empty, the runner uses:
#   <cuda_model_root>/build/camera.backbone.plan
#   <cuda_model_root>/build/camera.vtransform.plan
#   <cuda_model_root>/lidar.backbone.xyz.onnx
#   <cuda_model_root>/build/fuser.plan
#   <cuda_model_root>/build/head.bbox.plan
camera_plan:
vtransform_plan:
lidar_onnx:
fuser_plan:
head_plan:

enable_object_detection: true
enable_map_segmentation: false
map_plan:
map_input_binding: "middle"
map_output_binding: "map"
map_score_threshold: 0.5
map_classes:
  - "drivable_area"
  - "ped_crossing"
  - "walkway"
  - "stop_line"
  - "carpark_area"
  - "divider"

input_message_type: "RawMessage"
output_message_type: "RawMessage"

camera_topics:
  - "/sensor/camera/center_camera_fov120/encode"
  - "/sensor/camera/left_front_camera/encode"
  - "/sensor/camera/right_front_camera/encode"
  - "/sensor/camera/rear_camera/encode"
  - "/sensor/camera/left_rear_camera/encode"
  - "/sensor/camera/right_rear_camera/encode"
camera_order:
  - "front"
  - "front_left"
  - "front_right"
  - "rear"
  - "rear_left"
  - "rear_right"
lidar_topic: "/perception/lidar/preproc_points_cloud"
output_topic: "/perception/bevfusion/objects"

sync_tolerance_ms: 50.0
score_threshold: 0.2
publish_empty_frame: true

image_size: [128, 352]
image_resize: 0.48
image_mean: [0.485, 0.456, 0.406]
image_std: [0.229, 0.224, 0.225]
undistort_images: false
point_dim: 4
point_cloud_range: [-51.2, -51.2, -5.0, 51.2, 51.2, 3.0]

# Replace this with the real vehicle calibration yaml/json.
# CUDA-BEVFusion inference requires real calibration. Identity calibration is
# only useful for decoder smoke tests and is disabled by default.
calibration_file: "../../calibration.json"
calibration_extrinsic_direction: "lidar2camera"
allow_identity_calibration: false

# Optional offline rsclbag runner settings. These can also be passed as CLI args:
#   python3 -m deploy_rscl.rscl_bag_runner --bag /path/to/mybag.000.rsclbag --decode-only
bag_path:
max_frames:
output_file:
