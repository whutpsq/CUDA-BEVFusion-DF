node_name: "bevfusion_seg_rscl"
module_name: "bevfusion_seg_rscl"
device: "cuda:0"

model: "bevfusion_df_seg"
precision: "fp16"
profile: "bevfusion_df"
cuda_build_dir: "../../build"
cuda_model_root: "../../model/bevfusion_df_seg"
print_model_info: false

# Expected files after exporting/building the segmentation checkpoint:
#   model/bevfusion_df_seg/build/camera.backbone.plan
#   model/bevfusion_df_seg/build/camera.vtransform.plan
#   model/bevfusion_df_seg/lidar.backbone.xyz.onnx
#   model/bevfusion_df_seg/build/fuser.plan
#   model/bevfusion_df_seg/build/head.map.plan
camera_plan:
vtransform_plan:
lidar_onnx:
fuser_plan:
head_plan:

enable_object_detection: false
enable_map_segmentation: true
map_plan:
map_input_binding: "middle"
map_output_binding: "map"
map_score_threshold: 0.5
map_classes:
  - "solid_lane"
  - "dashed_lane"
  - "double_solid"
  - "diversion_boundary"
  - "centerline"
  - "stopline"
  - "crosswalk"
  - "roadside"
  - "area"
  - "arrow"

input_message_type: "RawMessage"
output_message_type: "RawMessage"

camera_topics:
  - "/sensor/camera/center_camera_fov120/encode"
  - "/sensor/camera/left_front_camera/encode"
  - "/sensor/camera/right_front_camera/encode"
  - "/sensor/camera/rear_camera/encode"
  - "/sensor/camera/left_rear_camera/encode"
  - "/sensor/camera/right_rear_camera/encode"
camera_order:
  - "front"
  - "front_left"
  - "front_right"
  - "rear"
  - "rear_left"
  - "rear_right"
lidar_topic: "/perception/lidar/preproc_points_cloud"
output_topic: "/perception/bevfusion/map"

sync_tolerance_ms: 50.0
score_threshold: 0.2
publish_empty_frame: true

image_size: [256, 704]
image_resize: 0.48
image_mean: [0.485, 0.456, 0.406]
image_std: [0.229, 0.224, 0.225]
# Raw vehicle images must match the training pipeline's undistort=true.
undistort_images: true

point_dim: 4
point_cloud_range: [-51.2, -51.2, -5.0, 51.2, 51.2, 3.0]

calibration_file: "../../calibration.json"
calibration_extrinsic_direction: "lidar2camera"
allow_identity_calibration: false

bag_path:
max_frames:
output_file:
